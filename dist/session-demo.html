<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo session request</title>
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/demo.js" defer></script>
</head>
<body class="form-body">
  <form id="demo-form">
    <fieldset disabled>
      <legend>Session details</legend>
      <label for="name">Name</label>
      <input id="name" autocomplete="name" required>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="message">What would you like to share?</label>
      <textarea id="message" rows="4"></textarea>
      <button class="button" type="submit">Test submission <span aria-hidden="true">&nearr;</span></button>
    </fieldset>
    <p id="form-status" role="status"></p>
  </form>
</body>
</html>
